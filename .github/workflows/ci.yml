name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: python -m compileall -q therapygym
      - name: Install lightweight test dependencies
        run: pip install pytest requests openai httpx boto3
      - name: Run unit tests
        run: PYTHONPATH=. python -m pytest -q
